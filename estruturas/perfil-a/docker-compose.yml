# Banco local para desenvolvimento (Perfil A). Fixe a versão da imagem que o sistema usar.
# A porta fica presa ao 127.0.0.1: o banco não fica acessível pela rede (S-26).
services:
  banco:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data

volumes:
  dados-banco:
