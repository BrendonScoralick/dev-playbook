# Atualizador de dependências nativo do GitHub (S-20). Abre PRs de atualização;
# cada PR passa pelo CI e pela revisão como qualquer outro. Nunca fazer merge automático.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
